# Alacritty's URL hints sit on CTRL+SHIFT+U, which the fcitx5 unicode addon
# claims by default for direct hex entry. fcitx5 holds the Wayland
# input-method grab and gets the key first, so the hint never fired and
# nothing on screen lit up. Clearing this leaves the addon's own picker on
# CTRL+ALT+SHIFT+U, which nothing else here wants.
DirectUnicodeMode=
