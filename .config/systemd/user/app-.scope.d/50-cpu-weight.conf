# Give every graphical app scope a CPU share of its own.
#
# systemd only delegates a controller into a slice once a unit inside it asks
# for that controller, and nothing under app.slice had ever set a CPU property
# — so app.slice carried `memory pids` in cgroup.subtree_control with no `cpu`,
# and every window competed as one flat pool of threads. A `go test ./...` in
# the terminal put dozens of runnable compilers against Slack's handful of
# renderer threads at the same nice level, and Slack got a few percent of the
# machine. Hyprland itself stayed responsive because session.slice does hold a
# cpu.weight against app.slice; the starvation was entirely inside app.slice.
#
# Naming the weight here, even at systemd's own default of 100, is what turns
# the cpu controller on in app.slice, so the share is divided per window rather
# than per thread. The directory is the dash-truncated form that matches every
# app-Hyprland-<app>-<hash>.scope Hyprland launches.

[Scope]
CPUAccounting=yes
CPUWeight=100
