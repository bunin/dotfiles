# Environment
run-shell ' \
  BASE_PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"; \
  USER_PATHS="$HOME/.local/bin:$HOME/.opencode/bin:$HOME/.cargo/bin:$HOME/go/bin:$HOME/.yarn/bin:$HOME/.lmstudio/bin"; \
  if [ "$(uname)" = "Darwin" ]; then \
    BREW_PATH="/opt/homebrew/bin"; \
    TMUX_PATH="$BREW_PATH:$USER_PATHS:$BASE_PATH"; \
  elif [ "$(uname)" = "Linux" ]; then \
    BREW_PATH="/home/linuxbrew/.linuxbrew/sbin:/home/linuxbrew/.linuxbrew/bin"; \
    TMUX_PATH="$BREW_PATH:$USER_PATHS:$BASE_PATH"; \
  else \
    TMUX_PATH="$USER_PATHS:$BASE_PATH"; \
  fi; \
  tmux set-environment -g PATH "$TMUX_PATH" \
'


# Destroy session when last client detaches.
# Exception: Claude Code's FleetView creates a detached session on its own
# socket (claude-swarm-<pid>), which destroy-unattached would kill instantly.
%if "#{m:*claude-swarm*,#{socket_path}}"
set-option -g destroy-unattached off
%else
set-option -g destroy-unattached on
%endif

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Start new windows in the current directory
bind c new-window -c '#{pane_current_path}'
# Start new vertical splits in the current directory
bind '"' split-window -v -c '#{pane_current_path}'
# Start new horizontal splits in the current directory
bind % split-window -h -c '#{pane_current_path}'

# List of plugins
set-window-option -g mode-keys vi
set -g focus-events off
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'
set -gq allow-passthrough on
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g mouse on
set -g extended-keys on
set -g @plugin 'tmux-plugins/tmux-yank'
#set -g @plugin 'noscript/tmux-mighty-scroll'

set -g @plugin 'bunin/tmux-power'
set -g @tmux_power_theme 'snow'
set -g @plugin 'wfxr/tmux-net-speed'
set -g @tmux_power_show_upload_speed true
set -g @tmux_power_show_download_speed true
# BMP-range icons: Termius on iPad renders the default U+F0000+ glyphs double-width
set -g @tmux_power_upload_speed_icon ''
set -g @tmux_power_download_speed_icon ''
set -g @tmux_power_show_clockify true
set -g @tmux_power_date_format '%a %-d %b '

set -g @plugin 'samoshkin/tmux-plugin-sysstat'
set -g @sysstat_cpu_view_tmpl ' #{cpu.pused}'
set -g @sysstat_mem_view_tmpl ' #{mem.used}'

set -g @plugin 'bunin/tmux-clockify'
set -g @tmux_power_show_kube_tmux true
#set -g @plugin 'dracula/tmux'
#set -g @dracula-plugins "git cpu-usage ram-usage time"
#set -g @dracula-show-powerline false
#set -g @dracula-show-flags false
#set -g @dracula-show-empty-plugins false
#set -g @dracula-show-timezone false

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
